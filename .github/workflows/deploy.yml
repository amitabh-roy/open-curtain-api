name: Backend CI/CD

on:
  push:
    branches:
      - development
      - feature/devops-2

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  ECR_REPOSITORY: opencurtain/api
  CONTAINER_NAME: opencurtain-api
  SNS_TOPIC_ARN: ${{ secrets.SNS_TOPIC_ARN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Creating env file
        run: |
          echo "${{secrets.ENV_FILE_DEV}}" > .env
          ls -la

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to EC2 Instance via SSM
        env:
          IMAGE_TAG: ${{ github.sha }}
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --parameters 'commands=[
              "set -e",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin '"$ECR_REGISTRY"'",
              "docker pull '"$ECR_REGISTRY"'/'"$ECR_REPOSITORY"':'"$IMAGE_TAG"'",

              "# --- Prepare rollback: rename + stop old container if it exists ---",
              "if docker ps -a --format \"{{.Names}}\" | grep -qx \"'"$CONTAINER_NAME"'\"; then",
              "  docker rename \"'"$CONTAINER_NAME"'\" \"'"$CONTAINER_NAME"'-old\"",
              "  docker stop \"'"$CONTAINER_NAME"'-old\" || true",
              "fi",

              "# Ensure network exists (ignore if already present)",
              "docker network create \"'"$CONTAINER_NAME"'-net\" 2>/dev/null || true",

              "# Start new container",
              "docker run -d --name \"'"$CONTAINER_NAME"'\" --network \"'"$CONTAINER_NAME"'-net\" -p 3001:3001 --restart unless-stopped \"'"$ECR_REGISTRY"'/'"$ECR_REPOSITORY"':'"$IMAGE_TAG"'\"",

              "# --- Health check (wait up to ~60s) ---",
              "HEALTHY=false",
              "for i in $(seq 1 12); do",
              "  if curl -sf --max-time 3 http://localhost:3001/ > /dev/null 2>&1; then",
              "    HEALTHY=true",
              "    break",
              "  fi",
              "  sleep 5",
              "done",

              "if [ \"$HEALTHY\" = true ]; then",
              "  echo \"New container is healthy – cleaning up old one\"",
              "  docker rm -f \"'"$CONTAINER_NAME"'-old\" 2>/dev/null || true",
              "  docker image prune -af",
              "else",
              "  echo \"New container failed health check – rolling back\"",
              "  docker stop \"'"$CONTAINER_NAME"'\" || true",
              "  docker rm \"'"$CONTAINER_NAME"'\" || true",
              "  if docker ps -a --format \"{{.Names}}\" | grep -qx \"'"$CONTAINER_NAME"'-old\"; then",
              "    docker rename \"'"$CONTAINER_NAME"'-old\" \"'"$CONTAINER_NAME"'\"",
              "    docker start \"'"$CONTAINER_NAME"'\"",
              "  fi",
              "  exit 1",
              "fi"
            ]' \
            --query 'Command.CommandId' \
            --output text)

            echo "SSM Command ID: $COMMAND_ID"

            echo "Waiting for SSM command..."

            set +e

            aws ssm wait command-executed \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

            WAITER_EXIT_CODE=$?

            set -e

            echo "SSM waiter exit code: $WAITER_EXIT_CODE"

            echo "========================================"
            echo "SSM COMMAND RESULT"
            echo "========================================"

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
              --output json

            if [ "$WAITER_EXIT_CODE" -ne 0 ]; then
              echo "========================================"
              echo "SSM deployment failed"
              echo "========================================"
              exit "$WAITER_EXIT_CODE"
            fi