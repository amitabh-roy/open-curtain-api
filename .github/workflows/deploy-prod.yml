name: Backend CI/CD For Production

on:
  push:
    branches:
      - release/production

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  ECR_REPOSITORY: opencurtain/api/production
  CONTAINER_NAME: opencurtain-api
  SNS_TOPIC_ARN: ${{ secrets.SNS_TOPIC_ARN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Creating env file
        run: |
          echo "${{secrets.ENV_FILE}}" > .env
          ls -la

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to Lightsail via SSM
        env:
          IMAGE_TAG: ${{ github.sha }}
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --instance-ids "${{ secrets.LIGHTSAIL_SSM_ID }}" \
            --parameters 'commands=[
              "set -e",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin '"$ECR_REGISTRY"'",
              "OLD_IMAGE=$(docker inspect --format='"'"'{{.Image}}'"'"' '"$CONTAINER_NAME"' 2>/dev/null || true)",
              "docker pull '"$ECR_REGISTRY"'/'"$ECR_REPOSITORY"':'"$IMAGE_TAG"'",
              "docker stop '"$CONTAINER_NAME"' || true",
              "docker rm '"$CONTAINER_NAME"' || true",
              "docker network create '"$CONTAINER_NAME"'-net || true",
              "docker run -d --name '"$CONTAINER_NAME"' --network '"$CONTAINER_NAME"'-net -p 3000:3000 --restart unless-stopped '"$ECR_REGISTRY"'/'"$ECR_REPOSITORY"':'"$IMAGE_TAG"'",
              "if [ -n \"$OLD_IMAGE\" ]; then docker rmi \"$OLD_IMAGE\" || true; fi",
              "docker image prune -af"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.LIGHTSAIL_SSM_ID }}"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.LIGHTSAIL_SSM_ID }}" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json